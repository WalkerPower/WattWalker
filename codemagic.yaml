# WattWalker — iOS on Codemagic (cloud Mac; no local Mac required).
#
# One-time Codemagic setup:
# 1. Add GitHub repo → branch `ios-codemagic` (or run all branches while testing).
# 2. Integrations → App Store Connect API key (Issuer ID, Key ID, .p8 file).
#    Reference that integration below (replace `app_store_connect` if you renamed it).
# 3. Ensure distribution certificate + App Store provisioning profile for
#    com.njsolar.wattwalker (Codemagic can generate/manage via the integration).
# 4. Environment variables: add Vite/Firebase keys needed at build time (mirror .env),
#    e.g. VITE_API_BASE_URL, GEMINI_API_KEY — never commit .env.
# 5. Optional: Team settings → Email notifications for build success/failure.
# 6. When ready for TestFlight: set submit_to_testflight: true (and add beta_groups if needed).
#
# Web production: deploy from `main`. Merge `ios-codemagic` → `main` when the pipeline is stable.
#
workflows:
  ios-app-store:
    name: WattWalker iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.njsolar.wattwalker
      node: 22.14.0
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-codemagic
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web (Vite → dist)
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Apply Xcode signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
